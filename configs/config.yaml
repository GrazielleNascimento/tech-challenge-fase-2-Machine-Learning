project:
  name: purchase_propensity
  random_seed: 42

data:
  raw_path: data/raw
  processed_path: data/processed
  prepared_path: data/prepared
  dataset_file: online_shoppers_intention.csv
  train_dataset_file: train.csv
  test_dataset_file: test.csv
  source_url: https://archive.ics.uci.edu/static/public/468/online+shoppers+purchasing+intention+dataset.zip

model:
  target_column: revenue
  test_size: 0.2
  model_path: models
  model_file: model.joblib
  metrics_path: metrics
  metrics_file: metrics.json
  params:
    n_estimators: 200
    max_depth: 10
    min_samples_leaf: 2
    class_weight: balanced

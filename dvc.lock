schema: '2.0'
stages:
  download_raw:
    cmd: "poetry run python -m purchase_propensity.data.download --url \"https://archive.ics.uci.edu/static/public/468/online+shoppers+purchasing+intention+dataset.zip\"\
      \ --output \"data/raw/online_shoppers_intention.csv\"\n"
    deps:
    - path: configs/config.yaml
      hash: md5
      md5: 87598a50cc2fa1dab980ee6ffdf97b11
      size: 1010
    - path: src/purchase_propensity/data/download.py
      hash: md5
      md5: 64fba419f0a50185a11e21c53bbde707
      size: 1252
    outs:
    - path: data/raw/online_shoppers_intention.csv
      hash: md5
      md5: cc6ec1db03b4f10f8de52c56ff48b085
      size: 1072063
  preprocess:
    cmd: "poetry run python -m purchase_propensity.data.preprocessing --input \"data/raw/online_shoppers_intention.csv\"\
      \ --output \"data/processed/online_shoppers_intention.csv\"\n"
    deps:
    - path: data/raw/online_shoppers_intention.csv
      hash: md5
      md5: cc6ec1db03b4f10f8de52c56ff48b085
      size: 1072063
    - path: src/purchase_propensity/data/preprocessing.py
      hash: md5
      md5: 1cc604f00a3c0722e6e2e00a77c0fed2
      size: 6380
    outs:
    - path: data/processed/online_shoppers_intention.csv
      hash: md5
      md5: d7997b99df75c13e6c5724b611cc6972
      size: 1159694
  build_features:
    cmd: "poetry run python -m purchase_propensity.features.build_features --input
      \"data/processed/online_shoppers_intention.csv\" --output \"data/prepared\"\n"
    deps:
    - path: data/processed/online_shoppers_intention.csv
      hash: md5
      md5: d7997b99df75c13e6c5724b611cc6972
      size: 1159694
    - path: src/purchase_propensity/features/build_features.py
      hash: md5
      md5: 29383a23176c63dbd7e2f1a90d1e35d4
      size: 10703
    outs:
    - path: data/prepared
      hash: md5
      md5: a041013c57773e6eef6ce0309e98955b.dir
      size: 4483024
      nfiles: 2
  train:
    cmd: "poetry run python -m purchase_propensity.models.train --input \"data/prepared/train.csv\"\
      \ --output \"models/model.joblib\"\n"
    deps:
    - path: data/prepared/train.csv
      hash: md5
      md5: cbe6ad96eed8efc579ae9d4d329384f8
      size: 3585401
    - path: src/purchase_propensity/models/train.py
      hash: md5
      md5: 96ab54e0717670fabbbec91a957db1f4
      size: 3515
    params:
      configs/config.yaml:
        model.params:
          n_estimators: 200
          max_depth: 10
          min_samples_leaf: 2
          class_weight: balanced
        project.random_seed: 42
    outs:
    - path: models/model.joblib
      hash: md5
      md5: a44a3fcbfb479a725a69c428e203242c
      size: 7690969
  evaluate:
    cmd: "poetry run python -m purchase_propensity.models.evaluate --model \"models/model.joblib\"\
      \ --input \"data/prepared/test.csv\" --output \"metrics/metrics.json\"\n"
    deps:
    - path: data/prepared/test.csv
      hash: md5
      md5: 91f2a75940f975220c7112d2054601f1
      size: 897623
    - path: models/model.joblib
      hash: md5
      md5: a44a3fcbfb479a725a69c428e203242c
      size: 7690969
    - path: src/purchase_propensity/models/evaluate.py
      hash: md5
      md5: 4adf81e329382dc17048dbfa20fb2ac6
      size: 3358
    outs:
    - path: metrics/metrics.json
      hash: md5
      md5: a3da08ee358bf4c606ae2a758e7d3b1b
      size: 170
  track:
    cmd: "poetry run python -m purchase_propensity.models.tracking --model \"models/model.joblib\"\
      \ --metrics \"metrics/metrics.json\" --input \"data/prepared/test.csv\" --output
      \"metrics/mlflow_run.json\"\n"
    deps:
    - path: metrics/metrics.json
      hash: md5
      md5: a3da08ee358bf4c606ae2a758e7d3b1b
      size: 170
    - path: models/model.joblib
      hash: md5
      md5: a44a3fcbfb479a725a69c428e203242c
      size: 7690969
    - path: src/purchase_propensity/models/tracking.py
      hash: md5
      md5: ac74f93d0b2cf1bdc3cd796be99eb2b7
      size: 4869
    params:
      configs/config.yaml:
        mlflow.experiment_name: purchase_propensity
    outs:
    - path: metrics/mlflow_run.json
      hash: md5
      md5: eb2391306835fdb19789b3be49c1f992
      size: 92
  register:
    cmd: "poetry run python -m purchase_propensity.models.registry --input \"metrics/mlflow_run.json\"\
      \ --output \"metrics/registered_model.json\"\n"
    deps:
    - path: metrics/mlflow_run.json
      hash: md5
      md5: eb2391306835fdb19789b3be49c1f992
      size: 92
    - path: src/purchase_propensity/models/registry.py
      hash: md5
      md5: 7d1c82a4246ecfcc685ad508201d4328
      size: 5814
    params:
      configs/config.yaml:
        mlflow.champion_alias: champion
        mlflow.min_improvement: 0.0
        mlflow.registered_model_name: purchase_propensity_classifier
        mlflow.selection_metric: f1
    outs:
    - path: metrics/registered_model.json
      hash: md5
      md5: 91574244077bbb8eea184c942e414cab
      size: 290

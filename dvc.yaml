vars:
  - configs/config.yaml

stages:

  download_raw:
    cmd: >
      poetry run python -m purchase_propensity.data.download
      --url "${data.source_url}"
      --output "${data.raw_path}/${data.dataset_file}"

    deps:
      - src/purchase_propensity/data/download.py
      - configs/config.yaml

    outs:
      - ${data.raw_path}/${data.dataset_file}


  preprocess:
    cmd: >
      poetry run python -m purchase_propensity.data.preprocessing
      --input "${data.raw_path}/${data.dataset_file}"
      --output "${data.processed_path}/${data.dataset_file}"

    deps:
      - ${data.raw_path}/${data.dataset_file}
      - src/purchase_propensity/data/preprocessing.py

    outs:
      - ${data.processed_path}/${data.dataset_file}


  build_features:
    cmd: >
      poetry run python -m purchase_propensity.features.build_features
      --input "${data.processed_path}/${data.dataset_file}"
      --output "${data.prepared_path}"

    deps:
      - ${data.processed_path}/${data.dataset_file}
      - src/purchase_propensity/features/build_features.py

    outs:
      - ${data.prepared_path}

  train:
    cmd: >
      poetry run python -m purchase_propensity.models.train
      --input "${data.prepared_path}/${data.train_dataset_file}"
      --output "${model.model_path}/${model.model_file}"

    deps:
      - ${data.prepared_path}/${data.train_dataset_file}
      - src/purchase_propensity/models/train.py

    params:
      - configs/config.yaml:
          - project.random_seed
          - model.params

    outs:
      - ${model.model_path}/${model.model_file}


  evaluate:
    cmd: >
      poetry run python -m purchase_propensity.models.evaluate
      --model "${model.model_path}/${model.model_file}"
      --input "${data.prepared_path}/${data.test_dataset_file}"
      --output "${model.metrics_path}/${model.metrics_file}"

    deps:
      - ${model.model_path}/${model.model_file}
      - ${data.prepared_path}/${data.test_dataset_file}
      - src/purchase_propensity/models/evaluate.py

    metrics:
      - ${model.metrics_path}/${model.metrics_file}:
          cache: false


  track:
    cmd: >
      poetry run python -m purchase_propensity.models.tracking
      --model "${model.model_path}/${model.model_file}"
      --metrics "${model.metrics_path}/${model.metrics_file}"
      --input "${data.prepared_path}/${data.test_dataset_file}"
      --output "${model.metrics_path}/${mlflow.run_info_file}"

    deps:
      - ${model.model_path}/${model.model_file}
      - ${model.metrics_path}/${model.metrics_file}
      - src/purchase_propensity/models/tracking.py

    params:
      - configs/config.yaml:
          - mlflow.experiment_name

    outs:
      - ${model.metrics_path}/${mlflow.run_info_file}:
          cache: false


  register:
    cmd: >
      poetry run python -m purchase_propensity.models.registry
      --input "${model.metrics_path}/${mlflow.run_info_file}"
      --output "${model.metrics_path}/${mlflow.registry_info_file}"

    deps:
      - ${model.metrics_path}/${mlflow.run_info_file}
      - src/purchase_propensity/models/registry.py

    params:
      - configs/config.yaml:
          - mlflow.registered_model_name
          - mlflow.champion_alias
          - mlflow.selection_metric
          - mlflow.min_improvement

    outs:
      - ${model.metrics_path}/${mlflow.registry_info_file}:
          cache: false
